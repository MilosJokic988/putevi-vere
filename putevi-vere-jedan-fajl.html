F\u0442\u043A\u0438 \u0442\u044B\u0441\u044F\u0447 \u0440\u0443\u0441\u0441\u043A\u0438\u0445 \u0431\u0435\u0436\u0435\u043D\u0446\u0435\u0432, \u0430 \u043A\u043E\u0440\u043E\u043B\u044C \u0410\u043B\u0435\u043A\u0441\u0430\u043D\u0434\u0440 \u043F\u043E\u043A\u0440\u043E\u0432\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E\u0432\u0430\u043B \u044D\u043C\u0438\u0433\u0440\u0430\u0446\u0438\u0438. \u0412 2007 \u0433\u043E\u0434\u0443 \u0420\u0443\u0441\u0441\u043A\u0430\u044F \u0417\u0430\u0440\u0443\u0431\u0435\u0436\u043D\u0430\u044F \u0426\u0435\u0440\u043A\u043E\u0432\u044C \u0432\u043E\u0441\u0441\u043E\u0435\u0434\u0438\u043D\u0438\u043B\u0430\u0441\u044C \u0441 \u041C\u043E\u0441\u043A\u043E\u0432\u0441\u043A\u0438\u043C \u041F\u0430\u0442\u0440\u0438\u0430\u0440\u0445\u0430\u0442\u043E\u043C."}},novisad:{ime:"\u041D\u043E\u0432\u0438-\u0421\u0430\u0434",kratko:"\u0412 \u0413\u0430\u043B\u0435\u0440\u0435\u0435 \u041C\u0430\u0442\u0438\u0446\u044B \u0441\u0435\u0440\u0431\u0441\u043A\u043E\u0439 \u0445\u0440\u0430\u043D\u044F\u0442\u0441\u044F \u0440\u0443\u0441\u0441\u043A\u0438\u0435 \u0438\u043A\u043E\u043D\u044B.",pogledi:{vera:"\u0412 \u0413\u0430\u043B\u0435\u0440\u0435\u0435 \u041C\u0430\u0442\u0438\u0446\u044B \u0441\u0435\u0440\u0431\u0441\u043A\u043E\u0439 \u0445\u0440\u0430\u043D\u044F\u0442\u0441\u044F \u0440\u0443\u0441\u0441\u043A\u0438\u0435 \u0438\u043A\u043E\u043D\u044B \u2014 \u0441\u0432\u0438\u0434\u0435\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E \u0434\u0430\u0432\u043D\u0438\u0445 \u0441\u0432\u044F\u0437\u0435\u0439 \u0441\u0435\u0440\u0431\u0441\u043A\u043E\u0433\u043E \u0438 \u0440\u0443\u0441\u0441\u043A\u043E\u0433\u043E \u0446\u0435\u0440\u043A\u043E\u0432\u043D\u043E\u0433\u043E \u0438\u0441\u043A\u0443\u0441\u0441\u0442\u0432\u0430."}},hopovo:{ime:"\u041D\u043E\u0432\u043E-\u0425\u043E\u043F\u043E\u0432\u043E",kratko:"\u041C\u043E\u043D\u0430\u0441\u0442\u044B\u0440\u044C, \u043A\u043E\u0442\u043E\u0440\u044B\u0439 \u0432 1920 \u0433\u043E\u0434\u0443 \u0432\u043E\u0437\u0440\u043E\u0434\u0438\u043B\u0438 \u0440\u0443\u0441\u0441\u043A\u0438\u0435 \u043C\u043E\u043D\u0430\u0445\u0438\u043D\u0438 \u041B\u0435\u0441\u043D\u0438\u043D\u0441\u043A\u043E\u0433\u043E \u043C\u043E\u043D\u0430\u0441\u0442\u044B\u0440\u044F.",pogledi:{istorija:"\u0412\u043E \u0432\u0440\u0435\u043C\u044F \u041F\u0435\u0440\u0432\u043E\u0439 \u043C\u0438\u0440\u043E\u0432\u043E\u0439 \u0432\u043E\u0439\u043D\u044B \u043C\u043E\u043D\u0430\u0441\u0442\u044B\u0440\u044C \u043E\u043F\u0443\u0441\u0442\u0435\u043B. \u0412 1920 \u0433\u043E\u0434\u0443 \u0435\u0433\u043E \u0432\u043E\u0437\u0440\u043E\u0434\u0438\u043B\u0438 \u0440\u0443\u0441\u0441\u043A\u0438\u0435 \u043C\u043E\u043D\u0430\u0445\u0438\u043D\u0438 \u041B\u0435\u0441\u043D\u0438\u043D\u0441\u043A\u043E\u0433\u043E \u043C\u043E\u043D\u0430\u0441\u0442\u044B\u0440\u044F, \u043F\u043E\u043A\u0438\u043D\u0443\u0432\u0448\u0438\u0435 \u0420\u043E\u0441\u0441\u0438\u044E \u043F\u043E\u0441\u043B\u0435 \u0440\u0435\u0432\u043E\u043B\u044E\u0446\u0438\u0438, \u0432\u043E \u0433\u043B\u0430\u0432\u0435 \u0441 \u0438\u0433\u0443\u043C\u0435\u043D\u044C\u0435\u0439 \u0415\u043A\u0430\u0442\u0435\u0440\u0438\u043D\u043E\u0439 (\u0415\u0444\u0438\u043C\u043E\u0432\u0441\u043A\u043E\u0439).",vera:"\u041C\u043E\u043D\u0430\u0445\u0438\u043D\u0438 \u043F\u043E\u0434\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u043B\u0438 \u0434\u0443\u0445\u043E\u0432\u043D\u0443\u044E \u0438 \u043A\u0443\u043B\u044C\u0442\u0443\u0440\u043D\u0443\u044E \u0436\u0438\u0437\u043D\u044C \u0440\u0443\u0441\u0441\u043A\u043E\u0439 \u044D\u043C\u0438\u0433\u0440\u0430\u0446\u0438\u0438 \u0438 \u0437\u0430\u0431\u043E\u0442\u0438\u043B\u0438\u0441\u044C \u043E \u0440\u0443\u0441\u0441\u043A\u0438\u0445 \u0441\u0438\u0440\u043E\u0442\u0430\u0445. \u041C\u043E\u043D\u0430\u0441\u0442\u044B\u0440\u044C \u0441\u0438\u043B\u044C\u043D\u043E \u043F\u043E\u0441\u0442\u0440\u0430\u0434\u0430\u043B \u0432\u043E \u0412\u0442\u043E\u0440\u043E\u0439 \u043C\u0438\u0440\u043E\u0432\u043E\u0439 \u0432\u043E\u0439\u043D\u0435; \u0432 1943 \u0433\u043E\u0434\u0443 \u043E\u0431\u0449\u0438\u043D\u0430 \u043F\u0435\u0440\u0435\u0431\u0440\u0430\u043B\u0430\u0441\u044C \u0432 \u0411\u0435\u043B\u0433\u0440\u0430\u0434, \u0430 \u043F\u043E\u0437\u0436\u0435 \u2014 \u0432\u043E \u0424\u0440\u0430\u043D\u0446\u0438\u044E.",kontekst:"\u0421\u0435\u0433\u043E\u0434\u043D\u044F \u041D\u043E\u0432\u043E-\u0425\u043E\u043F\u043E\u0432\u043E \u2014 \u043C\u0443\u0436\u0441\u043A\u043E\u0439 \u043C\u043E\u043D\u0430\u0441\u0442\u044B\u0440\u044C \u0421\u0435\u0440\u0431\u0441\u043A\u043E\u0439 \u0426\u0435\u0440\u043A\u0432\u0438 \u0438 \u043F\u0430\u043C\u044F\u0442\u043D\u0438\u043A \u043A\u0443\u043B\u044C\u0442\u0443\u0440\u044B \u0438\u0441\u043A\u043B\u044E\u0447\u0438\u0442\u0435\u043B\u044C\u043D\u043E\u0433\u043E \u0437\u043D\u0430\u0447\u0435\u043D\u0438\u044F."}},belacrkva:{ime:"\u0411\u0435\u043B\u0430-\u0426\u0440\u043A\u0432\u0430 (\u0411\u0435\u043B\u0430\u044F \u0426\u0435\u0440\u043A\u043E\u0432\u044C)",kratko:"\u0426\u0435\u043D\u0442\u0440 \u0440\u0443\u0441\u0441\u043A\u0438\u0445 \u043A\u0430\u0434\u0435\u0442: \u041F\u0435\u0440\u0432\u044B\u0439 \u0420\u0443\u0441\u0441\u043A\u0438\u0439 \u043A\u0430\u0434\u0435\u0442\u0441\u043A\u0438\u0439 \u043A\u043E\u0440\u043F\u0443\u0441 \u0438 \u0440\u0443\u0441\u0441\u043A\u043E\u0435 \u043A\u043B\u0430\u0434\u0431\u0438\u0449\u0435.",pogledi:{istorija:"\u041F\u043E\u0441\u043B\u0435 1920 \u0433\u043E\u0434\u0430 \u0432 \u0411\u0435\u043B\u0443\u044E \u0426\u0435\u0440\u043A\u043E\u0432\u044C \u043F\u0435\u0440\u0435\u0435\u0445\u0430\u043B\u0438 \u0446\u0435\u043B\u044B\u0435 \u0440\u0443\u0441\u0441\u043A\u0438\u0435 \u0443\u0447\u0435\u0431\u043D\u044B\u0435 \u0437\u0430\u0432\u0435\u0434\u0435\u043D\u0438\u044F: \u041D\u0438\u043A\u043E\u043B\u0430\u0435\u0432\u0441\u043A\u043E\u0435 \u043A\u0430\u0432\u0430\u043B\u0435\u0440\u0438\u0439\u0441\u043A\u043E\u0435 \u0443\u0447\u0438\u043B\u0438\u0449\u0435 \u0438\u0437 \u041F\u0435\u0442\u0440\u043E\u0433\u0440\u0430\u0434\u0430, \u041C\u0430\u0440\u0438\u0438\u043D\u0441\u043A\u0438\u0439 \u0414\u043E\u043D\u0441\u043A\u043E\u0439 \u0438\u043D\u0441\u0442\u0438\u0442\u0443\u0442 \u0438 \u041A\u0440\u044B\u043C\u0441\u043A\u0438\u0439 \u043A\u0430\u0434\u0435\u0442\u0441\u043A\u0438\u0439 \u043A\u043E\u0440\u043F\u0443\u0441. \u0412 1929 \u0433\u043E\u0434\u0443, \u043A\u043E\u0433\u0434\u0430 \u043F\u0440\u0438\u0431\u044B\u043B \u0438 \u043A\u043E\u0440\u043F\u0443\u0441 \u0438\u0437 \u0421\u0430\u0440\u0430\u0435\u0432\u0430, \u043E\u043D\u0438 \u043E\u0431\u044A\u0435\u0434\u0438\u043D\u0438\u043B\u0438\u0441\u044C \u0432 \u041F\u0435\u0440\u0432\u044B\u0439 \u0420\u0443\u0441\u0441\u043A\u0438\u0439 \u043A\u0430\u0434\u0435\u0442\u0441\u043A\u0438\u0439 \u043A\u043E\u0440\u043F\u0443\u0441 \u0432\u0435\u043B\u0438\u043A\u043E\u0433\u043E \u043A\u043D\u044F\u0437\u044F \u041A\u043E\u043D\u0441\u0442\u0430\u043D\u0442\u0438\u043D\u0430 \u041A\u043E\u043D\u0441\u0442\u0430\u043D\u0442\u0438\u043D\u043E\u0432\u0438\u0447\u0430.",vera:"\u0412 \u0433\u043E\u0440\u043E\u0434\u0435 \u0435\u0441\u0442\u044C \u0438 \u0441\u0432\u043E\u0451 \u0440\u0443\u0441\u0441\u043A\u043E\u0435 \u043A\u043B\u0430\u0434\u0431\u0438\u0449\u0435, \u0433\u0434\u0435 \u043F\u043E\u043A\u043E\u044F\u0442\u0441\u044F \u043F\u0440\u0435\u043F\u043E\u0434\u0430\u0432\u0430\u0442\u0435\u043B\u0438, \u043A\u0430\u0434\u0435\u0442\u044B \u0438 \u0438\u0445 \u0441\u0435\u043C\u044C\u0438.",kontekst:"\u0420\u0443\u0441\u0441\u043A\u0438\u0439 \u043D\u0430\u0443\u0447\u043D\u044B\u0439 \u0438\u043D\u0441\u0442\u0438\u0442\u0443\u0442 \u043F\u0440\u0438 \u0420\u0443\u0441\u0441\u043A\u043E\u043C \u0434\u043E\u043C\u0435 \u0432 \u0411\u0435\u043B\u0433\u0440\u0430\u0434\u0435 \u0438 \u043E\u0431\u0449\u0438\u043D\u0430 \u0411\u0435\u043B\u0430-\u0426\u0440\u043A\u0432\u0430 \u043F\u043E\u0434\u043F\u0438\u0441\u0430\u043B\u0438 \u0441\u043E\u0433\u043B\u0430\u0448\u0435\u043D\u0438\u0435 \u043E \u0441\u043E\u0445\u0440\u0430\u043D\u0435\u043D\u0438\u0438 \u043F\u0430\u043C\u044F\u0442\u0438 \u043E \u0440\u0443\u0441\u0441\u043A\u043E\u0439 \u044D\u043C\u0438\u0433\u0440\u0430\u0446\u0438\u0438. \u0413\u043E\u0440\u043E\u0434\u0441\u043A\u043E\u0439 \u043C\u0443\u0437\u0435\u0439 \u0445\u0440\u0430\u043D\u0438\u0442 \u043F\u0440\u0435\u0434\u043C\u0435\u0442\u044B \u0442\u043E\u0433\u043E \u0432\u0440\u0435\u043C\u0435\u043D\u0438."}},novibecej:{ime:"\u041D\u043E\u0432\u0438-\u0411\u0435\u0447\u0435\u0439",kratko:"\u0425\u0430\u0440\u044C\u043A\u043E\u0432\u0441\u043A\u0438\u0439 \u0434\u0435\u0432\u0438\u0447\u0438\u0439 \u0438\u043D\u0441\u0442\u0438\u0442\u0443\u0442 \u043F\u0440\u0438\u0431\u044B\u043B \u0441\u044E\u0434\u0430 \u0441\u043E 114 \u0443\u0447\u0435\u043D\u0438\u0446\u0430\u043C\u0438 \u0438 30 \u043F\u0440\u0435\u043F\u043E\u0434\u0430\u0432\u0430\u0442\u0435\u043B\u044F\u043C\u0438.",pogledi:{istorija:"\u0421\u0440\u0435\u0434\u0438 \u0440\u0443\u0441\u0441\u043A\u0438\u0445 \u0443\u0447\u0435\u0431\u043D\u044B\u0445 \u0437\u0430\u0432\u0435\u0434\u0435\u043D\u0438\u0439, \u043F\u0435\u0440\u0435\u0435\u0445\u0430\u0432\u0448\u0438\u0445 \u043F\u043E\u0441\u043B\u0435 1920 \u0433\u043E\u0434\u0430 \u0432 \u0412\u043E\u0435\u0432\u043E\u0434\u0438\u043D\u0443, \u0431\u044B\u043B \u0438 \u0425\u0430\u0440\u044C\u043A\u043E\u0432\u0441\u043A\u0438\u0439 \u0434\u0435\u0432\u0438\u0447\u0438\u0439 \u0438\u043D\u0441\u0442\u0438\u0442\u0443\u0442, \u043F\u0440\u0438\u0431\u044B\u0432\u0448\u0438\u0439 \u0432 \u041D\u043E\u0432\u0438-\u0411\u0435\u0447\u0435\u0439 \u0441\u043E 114 \u0443\u0447\u0435\u043D\u0438\u0446\u0430\u043C\u0438 \u0438 30 \u043F\u0440\u0435\u043F\u043E\u0434\u0430\u0432\u0430\u0442\u0435\u043B\u044F\u043C\u0438."}},adrovac:{ime:"\u0413\u043E\u0440\u043D\u0438-\u0410\u0434\u0440\u043E\u0432\u0430\u0446",kratko:"\u0420\u0443\u0441\u0441\u043A\u0430\u044F \u0446\u0435\u0440\u043A\u043E\u0432\u044C \u043D\u0430 \u043C\u0435\u0441\u0442\u0435 \u0433\u0438\u0431\u0435\u043B\u0438 \u0440\u0443\u0441\u0441\u043A\u043E\u0433\u043E \u0434\u043E\u0431\u0440\u043E\u0432\u043E\u043B\u044C\u0446\u0430 \u041D\u0438\u043A\u043E\u043B\u0430\u044F \u0420\u0430\u0435\u0432\u0441\u043A\u043E\u0433\u043E \u0432 1876 \u0433\u043E\u0434\u0443.",pogledi:{istorija:"\u0412 \u0421\u0435\u0440\u0431\u0441\u043A\u043E-\u0442\u0443\u0440\u0441\u043A\u043E\u0439 \u0432\u043E\u0439\u043D\u0435 1876 \u0433\u043E\u0434\u0430 \u043F\u043E\u043B\u043A\u043E\u0432\u043D\u0438\u043A \u041D\u0438\u043A\u043E\u043B\u0430\u0439 \u0420\u0430\u0435\u0432\u0441\u043A\u0438\u0439 \u0434\u043E\u0431\u0440\u043E\u0432\u043E\u043B\u044C\u0446\u0435\u043C \u0432\u0441\u0442\u0443\u043F\u0438\u043B \u0432 \u0430\u0440\u043C\u0438\u044E \u0433\u0435\u043D\u0435\u0440\u0430\u043B\u0430 \u0427\u0435\u0440\u043D\u044F\u0435\u0432\u0430. \u041E\u043D \u043F\u043E\u0433\u0438\u0431 20 \u0430\u0432\u0433\u0443\u0441\u0442\u0430 (1 \u0441\u0435\u043D\u0442\u044F\u0431\u0440\u044F) 1876 \u0433\u043E\u0434\u0430 \u0432 \u0431\u043E\u044E \u0443 \u0413\u043E\u0440\u043D\u0438-\u0410\u0434\u0440\u043E\u0432\u0430\u0446\u0430. \u041C\u0430\u0442\u044C \u0443\u0432\u0435\u0437\u043B\u0430 \u0435\u0433\u043E \u0442\u0435\u043B\u043E \u0432 \u0420\u043E\u0441\u0441\u0438\u044E.",vera:"\u041D\u0430 \u043C\u0435\u0441\u0442\u0435 \u0433\u0438\u0431\u0435\u043B\u0438 \u0432 \u043D\u0430\u0447\u0430\u043B\u0435 XX \u0432\u0435\u043A\u0430 \u0431\u044B\u043B\u0430 \u043F\u043E\u0441\u0442\u0440\u043E\u0435\u043D\u0430 \u0446\u0435\u0440\u043A\u043E\u0432\u044C \u0421\u0432\u044F\u0442\u043E\u0439 \u0422\u0440\u043E\u0438\u0446\u044B, \u0438\u0437\u0432\u0435\u0441\u0442\u043D\u0430\u044F \u043A\u0430\u043A \u0420\u0443\u0441\u0441\u043A\u0430\u044F \u0446\u0435\u0440\u043A\u043E\u0432\u044C, \u043D\u0430 \u0437\
